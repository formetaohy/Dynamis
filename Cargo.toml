[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.4.0"
edition = "2024"
description = "GPU-driven physics engine"
license = "MIT"
repository = "https://github.com/formetaohy/Dynamis"

[workspace.dependencies]
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
wgpu = "30"
dynamis-gpu = { version = "0.4.0", path = "crates/dynamis-gpu" }
dynamis-layout = { version = "0.4.0", path = "crates/dynamis-layout" }
dynamis-model = { version = "0.4.0", path = "crates/dynamis-model" }
dynamis-query = { version = "0.4.0", path = "crates/dynamis-query" }
dynamis-sim = { version = "0.4.0", path = "crates/dynamis-sim" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
warnings = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[package]
name = "dynamis"
version.workspace = true
edition.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
dynamis-gpu = { workspace = true }
dynamis-layout = { workspace = true }
dynamis-model = { workspace = true }
dynamis-query = { workspace = true }
dynamis-sim = { workspace = true }

[dev-dependencies]
bytemuck = { workspace = true }
pollster = { workspace = true }
wgpu = { workspace = true }

[[example]]
name = "falling_spheres"
path = "examples/falling_spheres.rs"

[lints]
workspace = true
