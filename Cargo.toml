[workspace]
resolver = "2"
members = ["crates/*", "examples/*"]

[workspace.package]
version = "0.4.1"
edition = "2024"
description = "GPU-driven physics engine"
license = "MIT"
repository = "https://github.com/formetaohy/Dynamis"

[workspace.dependencies]
bevy = { version = "0.19", default-features = false, features = [
    "default_app",
    "default_platform",
    "3d_bevy_render",
    "ui_api",
    "ui_bevy_render",
] }
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
wgpu = "30"
dynamis-gpu = { version = "0.4.1", path = "crates/dynamis-gpu" }
dynamis-layout = { version = "0.4.1", path = "crates/dynamis-layout" }
dynamis-model = { version = "0.4.1", path = "crates/dynamis-model" }
dynamis-profile = { version = "0.4.1", path = "crates/dynamis-profile" }
dynamis-query = { version = "0.4.1", path = "crates/dynamis-query" }
dynamis-sim = { version = "0.4.1", path = "crates/dynamis-sim" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
warnings = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[package]
name = "dynamis"
version.workspace = true
edition.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
dynamis-gpu = { workspace = true }
dynamis-layout = { workspace = true }
dynamis-model = { workspace = true }
dynamis-query = { workspace = true }
dynamis-sim = { workspace = true }

[dev-dependencies]
bevy = { workspace = true }
dynamis-example-common = { path = "examples/common" }
bytemuck = { workspace = true }
dynamis-layout = { workspace = true }
dynamis-profile = { workspace = true }
pollster = { workspace = true }
wgpu = { workspace = true }

[[example]]
name = "falling_shapes"
path = "examples/falling_shapes.rs"

[[example]]
name = "benchmark"
path = "examples/benchmark.rs"

[[example]]
name = "joints"
path = "examples/joints.rs"

[[example]]
name = "queries"
path = "examples/queries.rs"

[[example]]
name = "sensors"
path = "examples/sensors.rs"

[lints]
workspace = true
