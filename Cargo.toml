[workspace]
resolver = "2"
members = ["crates/*", "examples/*"]

[workspace.package]
version = "0.7.0"
edition = "2024"
description = "GPU-driven physics engine"
license = "MIT"
repository = "https://github.com/formetaohy/Dynamis"

[workspace.dependencies]
async-lock = "3.4"
bytemuck = { version = "1", features = ["derive"] }
naga = { version = "30", default-features = false, features = ["wgsl-in"] }
pollster = "0.4"
wgpu = { version = "30", default-features = false, features = [
    "std",
    "parking_lot",
    "dx12",
    "metal",
    "vulkan",
    "wgsl",
] }
winit = "0.30"
glam = "0.32"
font8x8 = "0.3"
dynamis-gpu = { version = "0.7.0", path = "crates/dynamis-gpu" }
dynamis-domain = { version = "0.7.0", path = "crates/dynamis-domain" }
dynamis-model = { version = "0.7.0", path = "crates/dynamis-model" }
dynamis-hull = { version = "0.7.0", path = "crates/dynamis-hull" }
dynamis-abi = { version = "0.7.0", path = "crates/dynamis-abi" }
dynamis-broadphase = { version = "0.7.0", path = "crates/dynamis-broadphase" }
dynamis-pass = { version = "0.7.0", path = "crates/dynamis-pass" }
dynamis-shader = { version = "0.7.0", path = "crates/dynamis-shader" }
dynamis-sort = { version = "0.7.0", path = "crates/dynamis-sort" }
dynamis-state = { version = "0.7.0", path = "crates/dynamis-state" }
dynamis-rigid = { version = "0.7.0", path = "crates/dynamis-rigid" }
dynamis-soft = { version = "0.7.0", path = "crates/dynamis-soft" }
dynamis-world = { version = "0.7.0", path = "crates/dynamis-world" }
dynamis-character = { version = "0.7.0", path = "crates/dynamis-character" }
dynamis = { path = "." }
dynamis-example-profile = { path = "examples/profile" }
dynamis-example-render = { path = "examples/render" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
warnings = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[package]
name = "dynamis"
version.workspace = true
edition.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
dynamis-gpu = { workspace = true }
dynamis-abi = { workspace = true }
dynamis-model = { workspace = true }
dynamis-hull = { workspace = true }
dynamis-world = { workspace = true }
dynamis-character = { workspace = true }

[features]
profile = ["dynamis-gpu/profile", "dynamis-world/profile"]

[dev-dependencies]
dynamis-example-profile = { workspace = true }
dynamis-example-render = { workspace = true }
pollster = { workspace = true }

[[example]]
name = "falling"
path = "examples/falling.rs"

[[example]]
name = "benchmark"
path = "examples/benchmark.rs"
required-features = ["profile"]

[lints]
workspace = true

