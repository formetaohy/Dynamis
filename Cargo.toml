[workspace]
resolver = "2"
members = ["crates/*", "examples/*"]

[workspace.package]
version = "0.4.1"
edition = "2024"
description = "GPU-driven physics engine"
license = "MIT"
repository = "https://github.com/formetaohy/Dynamis"

[workspace.dependencies]
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
wgpu = { version = "30", default-features = false, features = [
    "std",
    "parking_lot",
    "dx12",
    "metal",
    "vulkan",
    "wgsl",
] }
winit = "0.30"
glam = "0.32"
font8x8 = "0.3"
dynamis-gpu = { version = "0.4.1", path = "crates/dynamis-gpu" }
dynamis-layout = { version = "0.4.1", path = "crates/dynamis-layout" }
dynamis-model = { version = "0.4.1", path = "crates/dynamis-model" }
dynamis-profile = { version = "0.4.1", path = "crates/dynamis-profile" }
dynamis-query = { version = "0.4.1", path = "crates/dynamis-query" }
dynamis-sim = { version = "0.4.1", path = "crates/dynamis-sim" }
dynamis-example-render = { path = "examples/render" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
warnings = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[package]
name = "dynamis"
version.workspace = true
edition.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
dynamis-gpu = { workspace = true }
dynamis-layout = { workspace = true }
dynamis-model = { workspace = true }
dynamis-query = { workspace = true }
dynamis-sim = { workspace = true }

[dev-dependencies]
dynamis-example-common = { path = "examples/common" }
dynamis-example-render = { workspace = true }
bytemuck = { workspace = true }
dynamis-profile = { workspace = true }
pollster = { workspace = true }

[[example]]
name = "falling_shapes"
path = "examples/falling_shapes.rs"

[[example]]
name = "benchmark"
path = "examples/benchmark.rs"

[[example]]
name = "joints"
path = "examples/joints.rs"

[[example]]
name = "queries"
path = "examples/queries.rs"

[[example]]
name = "sensors"
path = "examples/sensors.rs"

[lints]
workspace = true
