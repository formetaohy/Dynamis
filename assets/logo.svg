<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 13 510 154" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F1B3D"/>
      <stop offset="50%" stop-color="#081129"/>
      <stop offset="100%" stop-color="#030714"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A3D2F2"/>
      <stop offset="50%" stop-color="#F0F8FF"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>

    <linearGradient id="starRingGrad1" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2442B4"/>
      <stop offset="20%" stop-color="#335FD0"/>
      <stop offset="38%" stop-color="#4A84E8"/>
      <stop offset="55%" stop-color="#6FADF5"/>
      <stop offset="70%" stop-color="#9CCFFB"/>
      <stop offset="85%" stop-color="#D3EBFE"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="starRingGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1B368F"/>
      <stop offset="20%" stop-color="#284FB0"/>
      <stop offset="38%" stop-color="#3A6FC8"/>
      <stop offset="55%" stop-color="#5593DB"/>
      <stop offset="70%" stop-color="#78B5EA"/>
      <stop offset="85%" stop-color="#A7D2F5"/>
      <stop offset="100%" stop-color="#DCEAFB"/>
    </linearGradient>

    <linearGradient id="starRingGrad3" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#152A70"/>
      <stop offset="20%" stop-color="#1F3E8C"/>
      <stop offset="38%" stop-color="#2D57A0"/>
      <stop offset="55%" stop-color="#4274B0"/>
      <stop offset="70%" stop-color="#5E90C0"/>
      <stop offset="85%" stop-color="#84AAD1"/>
      <stop offset="100%" stop-color="#B0C4E0"/>
    </linearGradient>

    <linearGradient id="starRingGrad4" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F1F54"/>
      <stop offset="20%" stop-color="#172F6C"/>
      <stop offset="38%" stop-color="#224283"/>
      <stop offset="55%" stop-color="#325998"/>
      <stop offset="70%" stop-color="#476EAD"/>
      <stop offset="85%" stop-color="#6484C0"/>
      <stop offset="100%" stop-color="#879DD1"/>
    </linearGradient>

  </defs>

  <style>
    .bg-card {
      animation: fadeInBg 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .ring {
      transform-box: fill-box;
      transform-origin: center;
    }

    .ring-4 {
      opacity: 0;
      animation: ringPop 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.10s forwards;
    }
    .ring-3 {
      opacity: 0;
      animation: ringPop 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.18s forwards;
    }
    .ring-2 {
      opacity: 0;
      animation: ringPop 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.26s forwards;
    }
    .ring-1 {
      opacity: 0;
      animation: ringPop 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.34s forwards;
    }

    .letter {
      --d: 0.10s;
      fill-opacity: 0;
      stroke-opacity: 0;
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
      animation:
        glyphDraw 0.85s cubic-bezier(0.45, 0, 0.55, 1) var(--d) forwards,
        glyphFill 0.35s ease-out calc(var(--d) + 0.55s) forwards,
        glyphStroke 0.3s ease-out calc(var(--d) + 0.8s) forwards;
    }

    .letter-D { --d: 0.18s; }
    .letter-Y { --d: 0.26s; }
    .letter-N { --d: 0.34s; }
    .letter-A { --d: 0.42s; }
    .letter-M { --d: 0.50s; }
    .letter-I { --d: 0.58s; }
    .letter-S { --d: 0.66s; }

    @keyframes fadeInBg {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes ringPop {
      0% { opacity: 0; transform: scale(0.4) rotate(-15deg); }
      100% { opacity: 1; transform: scale(1) rotate(0deg); }
    }

    @keyframes glyphDraw {
      from {
        stroke-dashoffset: 1;
        stroke-opacity: 0;
      }
      5% {
        stroke-opacity: 1;
      }
      to {
        stroke-dashoffset: 0;
        stroke-opacity: 1;
      }
    }

    @keyframes glyphFill {
      from {
        fill-opacity: 0;
      }
      to {
        fill-opacity: 1;
      }
    }

    @keyframes glyphStroke {
      from {
        stroke-opacity: 1;
      }
      to {
        stroke-opacity: 0;
      }
    }
  </style>

  <rect class="bg-card" y="13" width="510" height="154" fill="url(#bgGrad)" rx="20"/>

  <g transform="translate(77.00, 90) scale(0.296730) translate(-399, -359)">
    <circle class="ring ring-4" cx="420" cy="380" r="136" fill="none" stroke="url(#starRingGrad4)" stroke-width="36"/>
    <circle class="ring ring-3" cx="406" cy="366" r="136" fill="none" stroke="url(#starRingGrad3)" stroke-width="36"/>
    <circle class="ring ring-2" cx="392" cy="352" r="136" fill="none" stroke="url(#starRingGrad2)" stroke-width="36"/>
    <circle class="ring ring-1" cx="378" cy="338" r="136" fill="none" stroke="url(#starRingGrad1)" stroke-width="36"/>
  </g>

